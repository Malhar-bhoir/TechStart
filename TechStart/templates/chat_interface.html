<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor Chat - TechStart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #chat-window { scroll-behavior: smooth; }
        .fade-in-up { animation: fadeInUp 0.5s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen font-sans">
        <!-- Sidebar -->
        <div class="w-72 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <a href="{% url 'home' %}" class="flex items-center gap-2">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span class="text-xl font-bold text-gray-800">TechStart</span>
                </a>
            </div>
            <div class="flex-grow p-4 overflow-y-auto">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Chat History</h3>
                <div class="space-y-2">
                    {% for i in "1234"|make_list %}
                    <a href="#" class="flex items-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
                        <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                        <span>Introduction to Python</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Main chat area -->
        <div class="flex-1 flex flex-col bg-gray-50">
            <div id="chat-window" class="flex-grow p-6 overflow-y-auto">
                <!-- Messages will be appended here -->
                <div class="flex gap-4 mb-8 fade-in-up">
                    <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-lg text-white flex-shrink-0">AI</div>
                    <div class="bg-white rounded-lg p-4 shadow-md max-w-xl">
                        <p class="text-gray-800">Hello! Welcome to the lesson on Python. I am your AI Tutor. To get started, ask me "What is Python?".</p>
                    </div>
                </div>
            </div>

            <!-- Message input area -->
            <div class="p-6 bg-white border-t border-gray-200">
                <div class="flex items-center bg-gray-100 rounded-full p-2">
                    <input id="message-input" type="text" placeholder="Ask a question or type a command..." class="flex-grow bg-transparent text-gray-800 placeholder-gray-500 focus:outline-none px-4">
                    <button id="mic-button" class="p-2 text-gray-500 hover:text-blue-600 focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-14 0m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </button>
                    <button id="send-button" class="p-2 text-gray-500 hover:text-blue-600 focus:outline-none">
                         <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
