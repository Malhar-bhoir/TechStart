{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 fade-in">
    <div class="max-w-3xl mx-auto">
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-gray-900">{{ title }}</h1>
            <p class="mt-3 text-lg text-gray-600">Select a topic below to begin your interactive lesson with the AI Tutor.</p>
        </div>

        <div class="mt-10 bg-white rounded-2xl shadow-xl p-6 space-y-4">
            {% for topic in topics %}
            <a href="{% url 'chat' %}" class="flex items-center p-5 rounded-lg group hover:bg-blue-50 transition-all duration-300">
                <div class="flex-shrink-0 h-12 w-12 flex items-center justify-center rounded-lg {{ topic.color_class }}">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        {{ topic.svg_path|safe }}
                    </svg>
                </div>
                <div class="ml-4 flex-grow">
                    <h3 class="text-lg font-bold text-gray-900">{{ topic.name }}</h3>
                </div>
                <div class="ml-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
